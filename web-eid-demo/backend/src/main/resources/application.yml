spring:
  application:
    name: webeid-demo
  profiles:
    active: demo   # Change to 'prod' for production
  datasource:
    url: jdbc:h2:mem:webeiddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

server:
  port: 8080
